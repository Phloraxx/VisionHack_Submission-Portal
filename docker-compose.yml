services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - APP_URL=${APP_URL}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - POCKETBASE_URL=${POCKETBASE_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - SENTRY_DSN=${SENTRY_DSN}
      # Trust forwarded IP headers (CF-Connecting-IP / X-Forwarded-For) for
      # per-IP rate limiting. Only set when behind Cloudflare / a trusted
      # ingress that overwrites these headers.
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-0}
