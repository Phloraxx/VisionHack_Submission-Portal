services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - APP_URL=${APP_URL}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - SENTRY_DSN=${SENTRY_DSN}
      # REQUIRED in production: trust forwarded IP headers (CF-Connecting-IP /
      # X-Forwarded-For) for per-IP rate limiting. Only set when behind
      # Cloudflare / a trusted ingress that overwrites these headers.
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-0}
      # Embedded SQLite + app-issued JWT sessions. The database is a single
      # file on the volume below, so it survives redeploys.
      - SQLITE_PATH=${SQLITE_PATH:-/app/data/portal.db}
      - APP_JWT_SECRET=${APP_JWT_SECRET}
      - UPLOADS_DIR=${UPLOADS_DIR:-/app/uploads}
    volumes:
      # Submission files live on the host so they survive redeploys.
      - /home/drvij/services/visionhack-portal/uploads:/app/uploads
      # The SQLite database (plus its -wal/-shm siblings) lives on the host so
      # it survives redeploys. Back it up with `VACUUM INTO`, never a copy.
      - /home/drvij/portal-data:/app/data
    # The app needs no Linux capabilities beyond binding its own port.
    cap_drop:
      - ALL
    # The healthcheck is declared in the Dockerfile and inherited from the
    # image; declaring it here as well would only be a second copy to drift.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
