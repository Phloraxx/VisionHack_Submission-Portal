services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - APP_URL=${APP_URL}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - SENTRY_DSN=${SENTRY_DSN}
      # REQUIRED in production: trust forwarded IP headers (CF-Connecting-IP /
      # X-Forwarded-For) for per-IP rate limiting. Only set when behind
      # Cloudflare / a trusted ingress that overwrites these headers.
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-0}
      # PostgreSQL on pg-hub + app-issued JWT sessions.
      - DATABASE_URL=${DATABASE_URL}
      - APP_JWT_SECRET=${APP_JWT_SECRET}
      - UPLOADS_DIR=${UPLOADS_DIR:-/app/uploads}
    volumes:
      # Submission files live on the host so they survive redeploys.
      - /home/drvij/services/visionhack-portal/uploads:/app/uploads
    # The app needs no Linux capabilities beyond binding its own port.
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
