services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - APP_URL=${APP_URL}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - SENTRY_DSN=${SENTRY_DSN}
      # Trust forwarded IP headers (CF-Connecting-IP / X-Forwarded-For) for
      # per-IP rate limiting. Only set when behind Cloudflare / a trusted
      # ingress that overwrites these headers.
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-0}
      # PostgreSQL on pg-hub + app-issued JWT sessions (docs/PG_PORT_PLAN.md §7).
      - DATABASE_URL=${DATABASE_URL}
      - APP_JWT_SECRET=${APP_JWT_SECRET}
      - UPLOADS_DIR=${UPLOADS_DIR:-/app/uploads}
    volumes:
      # Submission files live on the host so they survive redeploys.
      - /home/drvij/services/visionhack-portal/uploads:/app/uploads
