name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck + Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # The unit tests mock db.server, so they validate none of the SQL. This
      # runs every repository method against a real SQLite file in a temp dir
      # (schema applied from sqlite/schema.sql; no service container needed).
      - name: Integration (SQLite data layer)
        run: npm run test:integration

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx biome check .

  idor:
    name: IDOR (app HTTP + SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # A fresh file per run. The app applies sqlite/schema.sql on first boot
      # and `npm run seed:test` applies it too, so no separate schema step is
      # needed. The name must contain "test" (or the file must live under the
      # temp dir) or the seed refuses to run.
      SQLITE_PATH: /tmp/vh-ci/portal-test.db
      # Fixed CI-only signing key. Must be >= 32 bytes (env.server.ts).
      APP_JWT_SECRET: ci-idor-secret-0123456789abcdef0123456789abcdef
      UPLOADS_DIR: /tmp/uploads
      APP_URL: http://localhost:3000
      # The login action rejects a missing/mismatched Origin with a 403.
      ALLOWED_ORIGINS: http://localhost:3000
      FIXTURES_PATH: /tmp/visionhack-test-fixtures.json
      PORT: 3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Seed fixtures
        run: npm run seed:test

      - name: Build
        run: npm run build

      - name: Run IDOR suite
        run: |
          set -euo pipefail
          # NODE_ENV is set here only: at job level it would make `npm ci`
          # skip devDependencies (husky's prepare hook then fails).
          # `node server.ts` — not tsx — is the Dockerfile CMD: Node's type
          # stripping needs the explicit .ts extensions that tsx resolves for
          # us, so this is the only gate that exercises the production boot.
          NODE_ENV=production node server.ts > /tmp/app.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

          ready=0
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null "$APP_URL/login"; then
              echo "app ready after ${i}s"
              ready=1
              break
            fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "app exited before becoming ready"
              cat /tmp/app.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "app did not become ready within 60s"
            cat /tmp/app.log
            exit 1
          fi

          node tests/test-idor.mjs

      - name: App log (on failure)
        if: failure()
        run: cat /tmp/app.log || true

  build:
    name: Build
    if: github.ref == 'refs/heads/main'
    needs: [check, lint, idor]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # Boots the actual Docker image (the Dockerfile CMD, the exact runner-stage
  # file set, Node 22 type stripping) against a fresh SQLite database, so
  # boot-only regressions fail CI instead of crash-looping production. This
  # would have caught both the env.server import crash and the divergent-hashed
  # CSS from the `app.css?url` era (a second stylesheet link on /login).
  image:
    name: Docker image boot smoke
    if: github.ref == 'refs/heads/main'
    needs: [check, lint, idor]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t vh-ci-image .

      - name: Boot image in production mode
        run: |
          set -euo pipefail
          # Host networking so the app's port is reachable from the runner.
          # /app/data is the production database path; a tmpfs owned by the
          # unprivileged apprunner user lets the app create the file there.
          docker run -d --name vh-ci-app --network host \
            --tmpfs /app/data:rw,uid=1001,gid=1001 \
            -e SQLITE_PATH=/app/data/portal.db \
            -e APP_JWT_SECRET=ci-image-secret-0123456789abcdef0123456789abcdef \
            -e UPLOADS_DIR=/tmp/uploads \
            -e APP_URL=http://localhost:4199 \
            -e ALLOWED_ORIGINS=http://localhost:4199 \
            -e TRUST_PROXY_HEADERS=1 \
            -e NODE_ENV=production \
            -e PORT=4199 \
            vh-ci-image

          # Poll the app itself; docker's HEALTHCHECK has a 20s start period.
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:4199/api/health; then
              echo "app healthy after ${i}s"
              ready=1
              break
            fi
            running=$(docker inspect -f '{{.State.Running}}' vh-ci-app)
            if [ "$running" != "true" ]; then
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "app did not become healthy"
            docker logs vh-ci-app
            exit 1
          fi

      - name: Verify SSR page and stylesheet
        run: |
          set -euo pipefail
          html=$(curl -fsS http://localhost:4199/login)
          # Exactly one stylesheet href, and the named file must exist. The
          # `app.css?url` bug leaked a second, client-only CSS hash here.
          printf '%s' "$html" | grep -qE '/assets/[A-Za-z0-9_.-]+\.css'
          css=$(printf '%s' "$html" \
            | grep -oE '/assets/[A-Za-z0-9_.-]+\.css' | sort -u)
          echo "stylesheet hrefs: $css"
          [ "$(printf '%s\n' "$css" | grep -c .)" -eq 1 ]
          status=$(curl -fsS -o /dev/null -w '%{http_code}' \
            "http://localhost:4199$css")
          echo "stylesheet fetch: $status"

      - name: Container log (on failure)
        if: failure()
        run: docker logs vh-ci-app || true
