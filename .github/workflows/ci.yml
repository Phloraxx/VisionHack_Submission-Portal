name: CI

on:
  pull_request:
  push:
    branches: [main, v2]

jobs:
  build:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Typecheck
        # We exclude the Cloudflare worker file — its `env.d.ts` is
        # generated by `wrangler types` and only resolves inside the
        # Cloudflare Pages build environment.
        run: npm run typecheck 2>&1 | grep -v "worker/app.ts" | (grep -q "error TS" && exit 1 || exit 0)

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # The setup-pb script is a maintenance job — we only run it manually
  # or on a schedule so PRs don't try to hit a live PocketBase.
  setup-pb:
    name: Dry-run setup-pb (no auth)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/v2'
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Lint setup-pb script
        run: npx tsc --noEmit scripts/setup-pb.ts
