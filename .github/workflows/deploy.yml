name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

# The workflow only reads the triggering run and POSTs to a webhook.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Decide whether to deploy
        id: gate
        # SECURITY: never interpolate `${{ … }}` inside `run:`. GitHub
        # substitutes the expression into the script text before the shell
        # parses it, so a branch name containing `"` or `$(…)` would execute.
        # Values arrive through `env:` and are only ever expanded as quoted
        # shell variables.
        env:
          EVENT_BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVENT_STATUS: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail

          if [ "$EVENT_STATUS" != "success" ]; then
            echo "Skipping deploy: CI concluded $EVENT_STATUS"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # `v2` stays accepted until the rename to `main` has settled; remove it
          # once no workflow run reports the old branch name.
          if [ "$EVENT_BRANCH" != "main" ] && [ "$EVENT_BRANCH" != "v2" ]; then
            echo "Skipping deploy: $EVENT_BRANCH is not a deploy branch"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "deploy=true" >> "$GITHUB_OUTPUT"
          echo "branch=$EVENT_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Trigger Dokploy deployment
        if: steps.gate.outputs.deploy == 'true'
        env:
          # Carried through `env:` rather than `steps.gate.outputs`, so the
          # value never reaches the shell as script text.
          EVENT_BRANCH: ${{ github.event.workflow_run.head_branch }}
          DOKPLOY_WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK }}
        run: |
          set -euo pipefail
          body=$(jq -n --arg ref "refs/heads/$EVENT_BRANCH" '{ref: $ref}')
          curl --fail-with-body -X POST "$DOKPLOY_WEBHOOK" \
            --header "Content-type: application/json" \
            --data "$body"
